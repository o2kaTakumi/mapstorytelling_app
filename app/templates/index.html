<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Story Telling Map</title>
    <link rel="icon" href="data:,">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* UIパネルのデザイン */
        .story-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 5px;
            max-width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .navigation { margin-top: 15px; }
        button { padding: 10px 15px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
    </style>
</head>

<body>
    <div class="story-container">
        <h2 id="scene-name"></h2>
        <p id="narration"></p>
        <div class="navigation">
            <button id="prev-btn">前のシーンへ</button>
            <button id="next-btn">次のシーンへ</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const js_scenes = {{ scenes | tojson | safe }};
        const mapbox_access_token = "{{ mapbox_token }}";

        // デバッグ用: ブラウザのコンソール（F12キー）に中身を出力して確認
        // console.log("Flaskから受け取ったデータ:", js_scenes);
        js_scenes.forEach((scene) => {
            console.log(scene);
        });

        const sceneNameEl = document.getElementById('scene-name');
        const narrationEl = document.getElementById('narration');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // 2. データが空っぽ（APIエラー等）の場合の警告表示
        if (!js_scenes || js_scenes.length === 0) {
            sceneNameEl.textContent = "データがありません";
            narrationEl.textContent = "ターミナルにGemini APIのエラーが出ていないか確認してください。URLの末尾に ?refresh=true を付けて再読み込みすると再生成されます。";
        } else {
            // 地図のロードを待たずに、先にテキストだけ初期表示しておく
            sceneNameEl.textContent = js_scenes[0].name;
            narrationEl.textContent = js_scenes[0].narration;
        }

        // mapbox API
        mapboxgl.accessToken = mapbox_access_token;

        let currentSceneIndex = 0;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [135.7, 34.6],
            zoom: 5
        });

        map.on('load', () => {
            map.addSource('story-source', { 
                'type': 'geojson', 
                'data': { 'type': 'FeatureCollection', 'features': [] } 
            });

            // ポリゴン: 色がない場合は青、透明度がない場合は0.3をデフォルトにする
            map.addLayer({ 
                'id': 'story-fill-layer', 
                'type': 'fill', 
                'source': 'story-source', 
                'paint': { 
                    'fill-color': ['coalesce', ['get', 'fill-color'], '#0000ff'], 
                    'fill-opacity': ['coalesce', ['get', 'fill-opacity'], 0.3], 
                    'fill-outline-color': ['coalesce', ['get', 'fill-outline-color'], '#000000'] 
                }, 
                'filter': ['==', ['geometry-type'], 'Polygon'] 
            });

            // ライン: 色がない場合は青、太さがない場合は3、点線設定がない場合は実線[1, 0]にする
            map.addLayer({ 
                'id': 'story-line-layer', 
                'type': 'line', 
                'source': 'story-source', 
                'paint': { 
                    'line-color': ['coalesce', ['get', 'line-color'], '#0000ff'], 
                    'line-width': ['coalesce', ['get', 'line-width'], 3.0], 
                    'line-dasharray': ['get', 'line-dasharray']
                }, 
                'filter': ['==', ['geometry-type'], 'LineString'] 
            });

            // ポイント: 色がない場合は赤、半径がない場合は6にする
            map.addLayer({ 
                'id': 'story-circle-layer', 
                'type': 'circle', 
                'source': 'story-source', 
                'paint': { 
                    'circle-color': ['coalesce', ['get', 'circle-color'], '#ff0000'], 
                    'circle-radius': ['coalesce', ['get', 'circle-radius'], 6.0] 
                }, 
                'filter': ['==', ['geometry-type'], 'Point'] 
            });

            // ラベル
            // map.addLayer({
            //     'id': 'story-line-labels-layer',
            //     'type': 'symbol',
            //     'source': 'story-source',
            //     'filter': ['==', ['geometry-type'], 'LineString'],
            //     'layout': { 'text-field': ['get', 'name'], 'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'], 'text-size': 14, 'symbol-placement': 'line' },
            //     'paint': { 'text-color': '#333333', 'text-halo-color': 'rgba(255, 255, 255, 0.9)', 'text-halo-width': 1.5 }
            // });

            map.addLayer({
                'id': 'story-point-labels-layer',
                'type': 'symbol',
                'source': 'story-source',
                'filter': ['==', ['geometry-type'], 'Point'],
                'layout': {
                    'text-field': ['get', 'name'],
                    'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                    'text-size': 14,
                    'text-offset': [0, 1.5],
                    'text-anchor': 'top',
                    'text-allow-overlap': true
                },
                'paint': {
                    'text-color': '#333333',
                    'text-halo-color': 'rgba(255, 255, 255, 0.9)',
                    'text-halo-width': 1.5
                }
            });

            map.addLayer({
                'id': 'story-polygon-labels-layer',
                'type': 'symbol',
                'source': 'story-source',
                'filter': ['==', ['geometry-type'], 'Polygon'],
                'layout': {
                    'text-field': ['get', 'name'],
                    'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                    'text-size': 14,
                    'text-allow-overlap': true
                },
                'paint': {
                    'text-color': '#333333',
                    'text-halo-color': 'rgba(255, 255, 255, 0.9)',
                    'text-halo-width': 1.5
                }
            });

            map.addLayer({
                'id': 'story-line-labels-layer',
                'type': 'symbol',
                'source': 'story-source',
                'filter': ['==', ['geometry-type'], 'LineString'],
                'layout': {
                    'text-field': ['get', 'name'],
                    'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                    'text-size': 14,
                    'symbol-placement': 'line'
                },
                'paint': {
                    'text-color': '#333333',
                    'text-halo-color': 'rgba(255, 255, 255, 0.9)',
                    'text-halo-width': 1.5
                }
            });

            // マップのロード完了時にレイヤー（線や色）を反映
            if (js_scenes && js_scenes.length > 0) {
                updateScene(currentSceneIndex);
            }
        });

        function updateScene(index) {
            if (!js_scenes || js_scenes.length === 0) return;

            const scene = js_scenes[index];
            sceneNameEl.textContent = scene.name;
            narrationEl.textContent = scene.narration;
            
            map.fitBounds(scene.map_data.bounds, { padding: 100, duration: 1500 });
            
            const featuresWithStyle = scene.map_data.source.data.features.map(feature => {
                if (feature.properties.style) {
                    for (const [key, value] of Object.entries(feature.properties.style)) { 
                        feature.properties[key] = value; 
                    }
                }

                if (feature.geometry.type === "LineString" && !feature.properties['line-dasharray']) {
                    feature.properties['line-dasharray'] = [1, 0]
                }

                return feature;
            });
            
            const newGeoJSON = { 'type': 'FeatureCollection', 'features': featuresWithStyle };
            map.getSource('story-source').setData(newGeoJSON);
            
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === js_scenes.length - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentSceneIndex > 0) {
                currentSceneIndex--;
                updateScene(currentSceneIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSceneIndex < js_scenes.length - 1) {
                currentSceneIndex++;
                updateScene(currentSceneIndex);
            }
        });
    </script>
</body>
</html>
